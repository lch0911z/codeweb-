<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITAEWON BBQ - Premium Korean BBQ Buffet</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Thư viện tạo QR Code tự động -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --gold-primary: #d4af37;
            --k-orange: #ff6b35;
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --card-border: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 90px; min-height: 100vh; }

        header { background: rgba(26, 26, 26, 0.95); border-bottom: 1px solid var(--gold-primary); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-container { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-text { font-size: 1.1rem; font-weight: 900; color: var(--gold-primary); }
        .logo-text span { color: #fff; font-weight: 400; font-size: 0.65rem; display: block; }

        .role-switch { display: flex; gap: 6px; }
        .btn-nav { border: 1px solid var(--gold-primary); background: transparent; color: var(--gold-primary); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .btn-nav.active { background: var(--gold-primary); color: #000; }

        .vip-status-bar { background: rgba(212, 175, 55, 0.08); border-top: 1px solid rgba(212, 175, 55, 0.15); padding: 8px 16px; font-size: 0.85rem; }
        .vip-status-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .table-badge { background: var(--gold-primary); color: #000; padding: 2px 10px; border-radius: 12px; font-weight: 800; }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        .page-view { display: none; width: 100%; }
        .page-view.active { display: block; }

        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); }
        .cat-chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; background: var(--card-dark); color: var(--text-muted); border: 1px solid var(--card-border); cursor: pointer; }
        .cat-chip.active { background: linear-gradient(45deg, var(--k-orange), var(--gold-primary)); color: #fff; border: none; }

        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

        .dish-card { background: var(--card-dark); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .dish-img { width: 100%; height: 120px; object-fit: cover; }
        .dish-body { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .dish-title { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .dish-price { font-size: 0.85rem; font-weight: 800; color: var(--gold-primary); margin-bottom: 8px; }

        .quantity-control { display: flex; align-items: center; justify-content: space-between; background: #2a2a2a; border-radius: 6px; padding: 2px; }
        .btn-qty { background: var(--gold-primary); color: #000; border: none; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .order-bar-float { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18, 18, 18, 0.95); border-top: 1px solid var(--gold-primary); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); z-index: 100; }
        .btn-order-submit { background: linear-gradient(45deg, var(--k-orange), var(--gold-primary)); color: #fff; border: none; padding: 10px 20px; border-radius: 25px; font-weight: 800; cursor: pointer; }

        .box-card { background: var(--card-dark); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .btn-action { border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-gold { background: var(--gold-primary); color: #000; }
        .btn-danger { background: #dc3545; color: #fff; }
        .btn-print { background: #17a2b8; color: #fff; }
        .btn-bt { background: #28a745; color: #fff; }

        .admin-form { display: grid; gap: 10px; margin-bottom: 20px; }
        .admin-input { background: #2a2a2a; border: 1px solid var(--card-border); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; width: 100%; }

        /* GRID QR CODES */
        .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 400px; overflow-y: auto; padding: 8px; background: #181818; border-radius: 8px; }
        .qr-card { background: #fff; color: #000; padding: 10px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .qr-card div { margin-top: 5px; }

        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 80mm; color: #000; font-family: monospace; }
            .bill-title { text-align: center; font-size: 16px; font-weight: bold; }
            .bill-table { font-size: 20px; font-weight: bold; text-align: center; margin: 5px 0; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 4px 0; }
            .bill-item { display: flex; justify-content: space-between; font-size: 15px; margin: 6px 0; font-weight: bold; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="brand-logo-box">
                <div class="logo-text"><i class="fas fa-fire"></i> ITAEWON <span>VIP BUFFET</span></div>
            </div>
            <div class="role-switch">
                <button class="btn-nav active" id="btn-tab-customer" onclick="switchTab('customer', event)">Khách</button>
                <button class="btn-nav" id="btn-tab-kitchen" onclick="switchTab('kitchen', event)">Bếp</button>
                <button class="btn-nav" id="btn-tab-admin" onclick="switchTab('admin', event)">Admin</button>
            </div>
        </div>
    </header>

    <div class="vip-status-bar">
        <div class="vip-status-bar-inner">
            <span><i class="fas fa-crown" style="color:var(--gold-primary);"></i> Tây Ninh VIP</span>
            <span>Vị trí: <span class="table-badge" id="currentTableBadge">Bàn 01</span></span>
        </div>
    </div>

    <div class="main-container">
        <!-- KHÁCH VIEW -->
        <div id="view-customer" class="page-view active">
            <div class="categories-bar" id="categoryBar"></div>
            <div class="menu-grid" id="menuGrid"></div>
        </div>

        <!-- BẾP VIEW -->
        <div id="view-kitchen" class="page-view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="color:var(--gold-primary);"><i class="fas fa-concierge-bell"></i> Màn Hình Bếp</h3>
                <button class="btn-action btn-bt" onclick="connectBluetooth()"><i class="fab fa-bluetooth-b"></i> <span id="btStatus">Kết nối Máy in BT</span></button>
            </div>
            <div id="kitchenOrders"></div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="view-admin" class="page-view">
            <h3 style="color:var(--gold-primary); margin-bottom:16px;"><i class="fas fa-cog"></i> Quản Lý Hệ Thống & 35 Bàn QR</h3>
            
            <!-- THƯ MỤC / DANH MỤC -->
            <div class="box-card">
                <h4 style="margin-bottom:12px; color:var(--gold-primary)">Quản lý thư mục / Danh mục món</h4>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <input type="text" id="newCatInput" class="admin-input" placeholder="Tên thư mục mới (ví dụ: Hải Sản, Tráng Miệng)">
                    <button class="btn-action btn-gold" onclick="addCategory()">Thêm Thư Mục</button>
                </div>
                <div id="categoryAdminList" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
            </div>

            <!-- CHỌN BÀN THỬ NGHIỆM -->
            <div class="box-card">
                <h4 style="margin-bottom:12px; color:var(--gold-primary)">Đổi số bàn (Thủ công)</h4>
                <div style="display:flex; gap:10px;">
                    <select id="tableSelect" class="admin-input" onchange="changeTableFromSelect()"></select>
                </div>
            </div>

            <!-- QUẢN LÝ 35 BÀN VÀ MÃ QR -->
            <div class="box-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h4 style="color:var(--gold-primary)">Mã QR tự động (35 Bàn)</h4>
                    <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-print"></i> In bộ 35 mã QR</button>
                </div>
                <div class="qr-grid" id="qrGrid"></div>
            </div>

            <!-- THÊM MÓN MỚI -->
            <div class="box-card">
                <h4 style="margin-bottom:12px; color:var(--gold-primary)">Thêm món mới</h4>
                <div class="admin-form">
                    <input type="text" id="addDishName" class="admin-input" placeholder="Tên món ăn">
                    <input type="number" id="addDishPrice" class="admin-input" placeholder="Giá (VNĐ)">
                    <select id="addDishCat" class="admin-input"></select>
                    <input type="text" id="addDishImg" class="admin-input" placeholder="URL hình ảnh (không bắt buộc)">
                    <button class="btn-action btn-gold" onclick="addNewDish()">Thêm Món</button>
                </div>
            </div>

            <!-- DANH SÁCH MÓN ĂN -->
            <div class="box-card">
                <h4 style="margin-bottom:12px; color:var(--gold-primary)">Danh sách món ăn</h4>
                <div id="adminMenuList"></div>
            </div>
        </div>
    </div>

    <!-- THANH ORDER DƯỚI CÙNG -->
    <div class="order-bar-float" id="cartBar">
        <div>Đã chọn: <b style="color:var(--gold-primary)" id="cartCount">0</b> món</div>
        <button class="btn-order-submit" onclick="submitOrder()"><i class="fas fa-paper-plane"></i> GỬI ORDER</button>
    </div>

    <div id="printArea"></div>

    <script>
        const initialMenu = [
            { id: 1, name: "Bò Lô-Mê Sốt Hàn", price: 129000, cat: "Thịt Bò", img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300" },
            { id: 2, name: "Ba Chỉ Bò Mỹ Rưới Sốt", price: 99000, cat: "Thịt Bò", img: "https://images.unsplash.com/photo-1558030006-450675393462?w=300" },
            { id: 3, name: "Ba Chỉ Heo Sốt Cay", price: 89000, cat: "Thịt Heo", img: "https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?w=300" },
            { id: 4, name: "Coca Cola Lạnh", price: 15000, cat: "Nước Uống", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=300" }
        ];

        const initialCategories = ["Tất cả", "Thịt Bò", "Thịt Heo", "Nước Uống"];

        let menu = JSON.parse(localStorage.getItem('itaewon_menu')) || initialMenu;
        let categories = JSON.parse(localStorage.getItem('itaewon_cats')) || initialCategories;
        let cart = {};
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        // Đọc số bàn từ URL quét mã QR (ví dụ: ?table=Bàn 05)
        const urlParams = new URLSearchParams(window.location.search);
        let currentTable = urlParams.get('table') || localStorage.getItem('itaewon_table') || "Bàn 01";

        window.onload = function() {
            localStorage.setItem('itaewon_table', currentTable);
            document.getElementById('currentTableBadge').innerText = currentTable;
            
            renderCategories();
            renderMenu(menu);
            renderKitchenOrders();
            renderAdminMenu();
            init35TablesAndQRs();
        };

        function switchTab(tab, evt) {
            if (tab === 'kitchen') {
                const pass = prompt('Nhập mật khẩu Bếp:');
                if (pass !== '112244') { alert('Mật khẩu Bếp không đúng!'); return; }
            } else if (tab === 'admin') {
                const pass = prompt('Nhập mật khẩu Admin:');
                if (pass !== '505010') { alert('Mật khẩu Admin không đúng!'); return; }
            }

            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.btn-nav').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${tab}`).classList.add('active');
            const activeBtn = document.getElementById(`btn-tab-${tab}`);
            if (activeBtn) activeBtn.classList.add('active');

            document.getElementById('cartBar').style.display = (tab === 'customer') ? 'flex' : 'none';
            if (tab === 'kitchen') renderKitchenOrders();
            if (tab === 'admin') renderAdminMenu();
        }

        /* THƯ MỤC DANH MỤC */
        function renderCategories() {
            const bar = document.getElementById('categoryBar');
            bar.innerHTML = categories.map((cat, idx) => `
                <div class="cat-chip ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', event)">${cat}</div>
            `).join('');

            const select = document.getElementById('addDishCat');
            select.innerHTML = categories.filter(c => c !== 'Tất cả').map(c => `<option value="${c}">${c}</option>`).join('');

            const adminCatList = document.getElementById('categoryAdminList');
            adminCatList.innerHTML = categories.filter(c => c !== 'Tất cả').map(c => `
                <span style="background:#2a2a2a; border:1px solid #444; padding:4px 10px; border-radius:12px; font-size:0.85rem; display:inline-flex; align-items:center; gap:6px;">
                    ${c} <i class="fas fa-times" style="color:#dc3545; cursor:pointer;" onclick="deleteCategory('${c}')"></i>
                </span>
            `).join('');
        }

        function addCategory() {
            const input = document.getElementById('newCatInput');
            const val = input.value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                localStorage.setItem('itaewon_cats', JSON.stringify(categories));
                input.value = '';
                renderCategories();
            }
        }

        function deleteCategory(catName) {
            if (confirm(`Xóa thư mục "${catName}"?`)) {
                categories = categories.filter(c => c !== catName);
                localStorage.setItem('itaewon_cats', JSON.stringify(categories));
                renderCategories();
            }
        }

        /* TỰ ĐỘNG TẠO 35 BÀN VÀ Mã QR */
        function init35TablesAndQRs() {
            const select = document.getElementById('tableSelect');
            const qrGrid = document.getElementById('qrGrid');
            select.innerHTML = '';
            qrGrid.innerHTML = '';

            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 35; i++) {
                const tableName = `Bàn ${i < 10 ? '0' + i : i}`;
                
                // Nạp vào Select
                const opt = document.createElement('option');
                opt.value = tableName;
                opt.innerText = tableName;
                if (tableName === currentTable) opt.selected = true;
                select.appendChild(opt);

                // Nạp mã QR
                const tableUrl = `${baseUrl}?table=${encodeURIComponent(tableName)}`;
                const qrCard = document.createElement('div');
                qrCard.className = 'qr-card';
                
                const qrDiv = document.createElement('div');
                new QRCode(qrDiv, { text: tableUrl, width: 80, height: 80 });
                
                const label = document.createElement('div');
                label.innerHTML = `<b>${tableName}</b>`;
                
                qrCard.appendChild(qrDiv);
                qrCard.appendChild(label);
                qrGrid.appendChild(qrCard);
            }
        }

        function changeTableFromSelect() {
            const val = document.getElementById('tableSelect').value;
            currentTable = val;
            localStorage.setItem('itaewon_table', val);
            document.getElementById('currentTableBadge').innerText = val;
            alert(`Đã chuyển sang ${val}`);
        }

        /* MENU & ORDER */
        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = items.map(item => `
                <div class="dish-card">
                    <img class="dish-img" src="${item.img || 'https://via.placeholder.com/300'}" alt="${item.name}">
                    <div class="dish-body">
                        <div>
                            <div class="dish-title">${item.name}</div>
                            <div class="dish-price">${item.price.toLocaleString('vi-VN')}đ</div>
                        </div>
                        <div class="quantity-control">
                            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}">${cart[item.id] || 0}</span>
                            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, evt) {
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            if(evt && evt.target) evt.target.classList.add('active');
            
            if (cat === 'Tất cả') renderMenu(menu);
            else renderMenu(menu.filter(m => m.cat === cat));
        }

        function changeQty(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            
            const qtyEl = document.getElementById(`qty-${id}`);
            if(qtyEl) qtyEl.innerText = cart[id] || 0;
            
            const total = Object.values(cart).reduce((a, b) => a + b, 0);
            document.getElementById('cartCount').innerText = total;
        }

        function submitOrder() {
            const items = Object.keys(cart).map(id => {
                const dish = menu.find(m => m.id == id);
                return { name: dish ? dish.name : 'Món', qty: cart[id] };
            });

            if (items.length === 0) {
                alert('Vui lòng chọn ít nhất 1 món!');
                return;
            }

            const newOrder = {
                id: 'ORD_' + Date.now(),
                table: currentTable,
                time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
                items: items
            };

            let orders = JSON.parse(localStorage.getItem('itaewon_orders') || '[]');
            orders.unshift(newOrder);
            localStorage.setItem('itaewon_orders', JSON.stringify(orders));

            alert(`Gửi order thành công cho ${currentTable}!`);
            
            cart = {};
            document.getElementById('cartCount').innerText = 0;
            renderMenu(menu);
            renderKitchenOrders();
        }

        function renderKitchenOrders() {
            const container = document.getElementById('kitchenOrders');
            let orders = JSON.parse(localStorage.getItem('itaewon_orders') || '[]');

            if (orders.length === 0) {
                container.innerHTML = '<p style="color:#888;">Chưa có order nào...</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="box-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="color:var(--gold-primary); font-size:1.1rem;">${order.table}</b>
                        <small style="color:#888;">${order.time}</small>
                        <div>
                            <button class="btn-action btn-print" onclick="printOrder('${order.id}')">In bill</button>
                            <button class="btn-action btn-gold" onclick="finishOrder('${order.id}')">Xong</button>
                        </div>
                    </div>
                    <ul style="margin: 10px 0 0 20px;">
                        ${order.items.map(i => `<li>${i.name} x <b>${i.qty}</b></li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        /* KẾT NỐI BLUETOOTH */
        async function connectBluetooth() {
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });
                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let c of characteristics) {
                        if (c.properties.write || c.properties.writeWithoutResponse) {
                            bluetoothCharacteristic = c;
                            break;
                        }
                    }
                }
                if (bluetoothCharacteristic) {
                    document.getElementById('btStatus').innerText = 'Đã kết nối BT';
                    alert('Kết nối máy in Bluetooth thành công!');
                }
            } catch (error) {
                alert('Lỗi kết nối Bluetooth: ' + error.message);
            }
        }

        async function printOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('itaewon_orders') || '[]');
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            if (bluetoothCharacteristic) {
                try {
                    let text = `==============================\n   ITAEWON VIP - PHIEU BEP   \n==============================\nVi tri: ${order.table}\nThoi gian: ${order.time}\n------------------------------\n`;
                    order.items.forEach(i => { text += `${i.name}  x${i.qty}\n`; });
                    text += `------------------------------\n\n\n\n`;
                    await bluetoothCharacteristic.writeValue(new TextEncoder().encode(text));
                    return;
                } catch (e) { alert('Lỗi in BT: ' + e.message); }
            }

            document.getElementById('printArea').innerHTML = `
                <div class="bill-title">ITAEWON VIP - PHIẾU BẾP</div>
                <div class="bill-table">${order.table}</div>
                <div style="font-size:12px;">Thời gian: ${order.time}</div>
                <div style="border-top:1px dashed #000; padding-top:6px; margin-top:6px;">
                    ${order.items.map(i => `<div class="bill-item"><span>${i.name}</span><span>x${i.qty}</span></div>`).join('')}
                </div>
            `;
            window.print();
        }

        function finishOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('itaewon_orders') || '[]');
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('itaewon_orders', JSON.stringify(orders));
            renderKitchenOrders();
        }

        /* ADMIN QUẢN LÝ MÓN */
        function renderAdminMenu() {
            const list = document.getElementById('adminMenuList');
            list.innerHTML = menu.map(m => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom:1px solid #2a2a2a;">
                    <div>
                        <b>${m.name}</b> (${m.cat})
                        <div style="color:var(--gold-primary); font-size:0.85rem;">${m.price.toLocaleString('vi-VN')}đ</div>
                    </div>
                    <button class="btn-action btn-danger" onclick="deleteDish(${m.id})">Xóa</button>
                </div>
            `).join('');
        }

        function addNewDish() {
            const name = document.getElementById('addDishName').value.trim();
            const price = parseInt(document.getElementById('addDishPrice').value);
            const cat = document.getElementById('addDishCat').value;
            const img = document.getElementById('addDishImg').value.trim();

            if (!name || isNaN(price)) { alert('Vui lòng nhập tên và giá món!'); return; }

            const newDish = { id: Date.now(), name, price, cat, img: img || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=300' };
            menu.push(newDish);
            localStorage.setItem('itaewon_menu', JSON.stringify(menu));

            document.getElementById('addDishName').value = '';
            document.getElementById('addDishPrice').value = '';
            document.getElementById('addDishImg').value = '';

            renderAdminMenu();
            renderMenu(menu);
            alert('Thêm món thành công!');
        }

        function deleteDish(id) {
            if (confirm('Xóa món này?')) {
                menu = menu.filter(m => m.id !== id);
                localStorage.setItem('itaewon_menu', JSON.stringify(menu));
                renderAdminMenu();
                renderMenu(menu);
            }
        }
    </script>
</body>
</html>
